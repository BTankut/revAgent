name: revagent-phase1

services:
  gateway:
    image: ${GATEWAY_IMAGE:?set GATEWAY_IMAGE in the deployment environment}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      - DATABASE_URL
      - GATEWAY_PUBLIC_URL
      - LOG_LEVEL
      - OBJECT_STORE_DRIVER=fs
      - OBJECT_STORE_ROOT=/var/lib/revagent/objects
      - OIDC_CLIENT_ID
      - OIDC_ISSUER_URL
      - OIDC_JWKS_URI
      - PORT=8080
    volumes:
      - type: bind
        source: ${OBJECT_STORE_HOST_PATH:-/opt/revagent/data/objects}
        target: /var/lib/revagent/objects
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - data

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_DB
      - POSTGRES_PASSWORD
      - POSTGRES_USER
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_HOST_PATH:-/opt/revagent/data/postgres}
        target: /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - data

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/revagent/start-keycloak.sh"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?set KEYCLOAK_ADMIN_USERNAME}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: https://${GATEWAY_DOMAIN}/identity
      KC_HTTP_RELATIVE_PATH: /identity
      KC_PROXY_HEADERS: xforwarded
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25
    volumes:
      - type: bind
        source: ${KEYCLOAK_DATA_HOST_PATH:-/opt/revagent/data/keycloak}
        target: /opt/keycloak/data
      - ./keycloak/realm-revagent.json:/opt/keycloak/data/import/realm-revagent.json:ro
      - ./keycloak/start-keycloak.sh:/opt/revagent/start-keycloak.sh:ro
    secrets:
      - keycloak_bootstrap_credential
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:?set GATEWAY_DOMAIN}
    ports:
      # The Cloudflare connector runs on the host and is the only northbound
      # ingress. Never expose the origin directly on a LAN/WAN interface.
      - ${CADDY_ORIGIN_BIND:-127.0.0.1}:${CADDY_ORIGIN_PORT:-8081}:80
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ${CADDY_DATA_HOST_PATH:-/opt/revagent/data/caddy/data}
        target: /data
      - type: bind
        source: ${CADDY_CONFIG_HOST_PATH:-/opt/revagent/data/caddy/config}
        target: /config
    depends_on:
      gateway:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

networks:
  edge:
  data:
    internal: true

secrets:
  keycloak_bootstrap_credential:
    file: ${KEYCLOAK_BOOTSTRAP_CREDENTIAL_FILE:?set KEYCLOAK_BOOTSTRAP_CREDENTIAL_FILE}
