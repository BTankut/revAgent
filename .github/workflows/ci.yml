name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner_labels_json:
        description: 'JSON array of runner labels. Defaults to the office self-hosted Windows runner to avoid GitHub-hosted Actions budget limits.'
        required: true
        default: '["self-hosted","Windows","revagent-cd"]'

concurrency: { group: "ci-${{ github.event.pull_request.number || github.run_id }}", cancel-in-progress: true }

jobs:
  engineering-gates:
    name: Engineering gates
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.runner_labels_json || '["self-hosted","Windows","revagent-cd"]') }}
    # There is exactly one self-hosted runner, and both jobs here plus the
    # Claude review gate ask for its labels. A job that hangs holds it until a
    # human notices, and everything else reports `queued` rather than failing --
    # on 2026-08-02 a hung conformance run held it for 55 minutes and blocked an
    # unrelated PR's gates the whole time. GitHub's default is 360 minutes, so
    # the ceiling has to be set explicitly. 25 covers the 14m1s this job has
    # actually taken with headroom.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Materialize exact protected source bytes
        shell: cmd
        run: git archive --format=tar HEAD | tar -xf - && git add --update && git diff --cached --quiet HEAD -- && git diff --quiet --

      - name: Prepare isolated npm cache
        shell: pwsh
        run: |
          $gitTools = Join-Path $env:ProgramFiles 'Git\usr\bin'
          foreach ($tool in @('tar.exe', 'gzip.exe')) {
            $toolPath = Join-Path $gitTools $tool
            if (-not (Test-Path -LiteralPath $toolPath -PathType Leaf)) {
              throw "Required npm-cache compression tool is missing: $toolPath"
            }
          }
          $gitTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $npmCache = Join-Path $env:RUNNER_TEMP "npm-cache-$env:GITHUB_JOB"
          New-Item -ItemType Directory -Path $npmCache -Force | Out-Null
          "NPM_CONFIG_CACHE=$npmCache" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: |
            installer/runtime-mcp-server/package-lock.json
            installer/revit-api-docs-mcp/package-lock.json

      - name: Run CI-safe gates
        shell: pwsh
        run: .\scripts\test-ci.ps1

      - name: Verify installer security contracts in Windows PowerShell 5.1
        shell: powershell
        run: |
          .\scripts\test-codex-integration-security.ps1
          .\scripts\test-os-path-security.ps1
          .\scripts\test-source-free-migration.ps1
          .\scripts\test-installer-smoke.ps1
          .\scripts\test-shared-ancestor-acl.ps1
          .\scripts\test-updater-stabilization-g7-g9.ps1
          .\scripts\test-local-update-bootstrap.ps1
          .\scripts\test-clean-install-bootstrap.ps1
          .\scripts\test-signed-stable-readiness.ps1
          .\scripts\test-signed-source-free-cd.ps1
          .\scripts\test-desktop-launcher-cleanup.ps1

  # Bounded M0 exception to P-CD-3: RES-24 and the dated R-F record land first
  # through PR #268. Existing CI jobs remain unchanged; later Gateway CI uses
  # its dedicated workflow.
  gateway-gates:
    name: Gateway gates
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.runner_labels_json || '["self-hosted","Windows","revagent-cd"]') }}
    # Same single-runner exposure as engineering-gates above. 70 leaves headroom
    # over the conformance step's own 60 so that step fails first and names
    # itself, and over the 42-46 minutes this job takes whenever that step runs.
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Materialize exact protected source bytes
        shell: cmd
        run: git archive --format=tar HEAD | tar -xf - && git add --update && git diff --cached --quiet HEAD -- && git diff --quiet --

      - name: Prepare isolated npm cache
        shell: pwsh
        run: |
          $gitTools = Join-Path $env:ProgramFiles 'Git\usr\bin'
          foreach ($tool in @('tar.exe', 'gzip.exe')) {
            $toolPath = Join-Path $gitTools $tool
            if (-not (Test-Path -LiteralPath $toolPath -PathType Leaf)) {
              throw "Required npm-cache compression tool is missing: $toolPath"
            }
          }
          $gitTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $npmCache = Join-Path $env:RUNNER_TEMP "npm-cache-$env:GITHUB_JOB"
          New-Item -ItemType Directory -Path $npmCache -Force | Out-Null
          "NPM_CONFIG_CACHE=$npmCache" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Bind Gateway gates to protected production Node
        shell: pwsh
        run: |
          $nodeDirectory = Join-Path $env:ProgramFiles 'nodejs'
          $nodeExecutable = Join-Path $nodeDirectory 'node.exe'
          if (-not (Test-Path -LiteralPath $nodeExecutable -PathType Leaf)) {
            throw "Protected production Node is missing: $nodeExecutable"
          }
          $resolved = (& $nodeExecutable -p 'process.execPath').Trim()
          if (-not [StringComparer]::OrdinalIgnoreCase.Equals($resolved, $nodeExecutable)) {
            throw "Protected production Node resolved unexpectedly: $resolved"
          }
          $nodeDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify protected production Node binding
        shell: pwsh
        run: |
          $expected = Join-Path $env:ProgramFiles 'nodejs\node.exe'
          $actual = (& node -p 'process.execPath').Trim()
          if (-not [StringComparer]::OrdinalIgnoreCase.Equals($actual, $expected)) {
            throw "Gateway gates resolved Node from an unprotected path: $actual"
          }
          $version = (& node -p 'process.versions.node').Trim()
          if ([version]$version -lt [version]'22.15.0') {
            throw "Gateway gates require protected production Node 22.15.0 or newer; found $version"
          }

      # Scope decision for the RBP conformance suite. The condition MUST stay at
      # step level on this classifier output:
      # - A workflow-level `paths:` filter never creates the required
      #   "Gateway gates" check run, so the PR blocks forever on
      #   "Expected - waiting for status" (RES-32, docs/decisions/DP-log.md,
      #   fixed by PR #310).
      # - A job-level `if:` makes GitHub report the job as skipped, and a
      #   skipped job reports Success and SATISFIES a required check - silent
      #   fail-open.
      # The classifier is fail-closed (default deny) and unit-tested by
      # scripts/test-ci-classifier.ps1 inside the required Engineering gates.
      - name: Classify changed paths for scoped gates
        id: classify
        shell: pwsh
        run: .\scripts\ci-classify-changes.ps1

      - name: Install migration workspace dependencies
        run: npm ci --ignore-scripts

      - name: Build and verify allowlisted native migration dependency
        run: |
          npm rebuild better-sqlite3 --ignore-scripts=false --foreground-scripts
          npm run verify:native-dependencies

      - name: Lint migration packages
        run: npm run lint

      - name: Type-check migration packages
        run: npm run typecheck

      - name: Verify generated protocol types and test migration packages
        shell: pwsh
        run: npm run check:generated && node scripts/run-workspace-tests-scoped.mjs

      - name: Run RBP conformance suite
        if: steps.classify.outputs.run_rbp == 'true'
        # Named separately from the job ceiling so a hang here fails as this
        # step rather than as an anonymous job timeout, and so the later steps
        # still run and report the scope decision that led here.
        #
        # 60, from measurement, not from what the suite ought to cost.
        #
        # Every CI run where this step actually executed -- it is skipped on
        # most PR branches by the classify step above -- put Gateway gates at
        # 42-46 minutes and passed: 43.4, 43.3, 42.9, 42.5, 45.6 on main and
        # 46.2 on a feature branch. Runs where it was skipped finish in 2-3
        # minutes, which is why PR checks look fast and main does not.
        #
        # Earlier passes here set 15 and then 25. Both were derived from
        # globalSetup.ts's own "~173 s per preparation" comment rather than
        # from observed job durations, and 25 killed a healthy run at 28
        # minutes. Setting this below the suite's real cost does not make it
        # faster; it just breaks main on every push.
        #
        # This ceiling bounds damage. It does not make the step fast, and 43
        # minutes is not acceptable as a steady state: scripts/run-tests.mjs
        # runs 5 shards sequentially and each boots its own vitest, so the
        # canonical production preparation is repeated once per shard --
        # roughly 14 of those 43 minutes. Preparing once and sharing it is the
        # fix, and it is a test-harness redesign rather than a CI setting.
        timeout-minutes: 60
        run: npm run test --workspace @revagent/rbp-conformance

      - name: Report scope decision
        if: always()
        shell: pwsh
        env:
          SCOPE_SUMMARY: ${{ steps.classify.outputs.summary }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SCOPE_SUMMARY)) {
            Write-Host '[scoped] no scope decision recorded (classify step did not run)'
          } else {
            Write-Host $env:SCOPE_SUMMARY
          }
