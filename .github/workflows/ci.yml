name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  engineering-gates:
    name: Engineering gates
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: |
            installer/runtime-mcp-server/package-lock.json
            installer/revit-api-docs-mcp/package-lock.json

      - name: Run CI-safe gates
        shell: pwsh
        run: .\scripts\test-ci.ps1
