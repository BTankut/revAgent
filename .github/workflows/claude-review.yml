name: Claude Code Review

# High-signal correctness reviewer. Posts ONLY validated, high-confidence issues;
# stays silent (one-line LGTM) on clean diffs. Has free read-only run of the whole
# repo (full history + blame) to follow a suspicious diff into the rest of the app.
# Pattern: anthropics/claude-code /code-review (HIGH SIGNAL only + validate-then-filter).
# Trigger on PR open and later pushed commits so the review tracks the latest head.
# Model: Opus 4.8 + xhigh.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read          # read-only repo + git history; NO write
  pull-requests: write    # only to post review comments
  id-token: write

jobs:
  review:
    if: ${{ github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Windows, revagent-cd]
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0          # full history + base branch -> git blame/log/diff base...head work

      - name: Prefer Git Bash on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $gitBashDirs = @(
            (Join-Path $env:ProgramFiles "Git\bin"),
            (Join-Path $env:ProgramFiles "Git\usr\bin")
          )
          $found = $false
          foreach ($dir in $gitBashDirs) {
            if (Test-Path -LiteralPath (Join-Path $dir "bash.exe") -PathType Leaf) {
              $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              $found = $true
            }
          }
          if (-not $found) {
            throw "Git Bash was not found on the self-hosted runner."
          }

      - name: Resolve Claude Code executable
        id: resolve-claude
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $command = Get-Command claude -ErrorAction SilentlyContinue
          if ($null -eq $command -or [string]::IsNullOrWhiteSpace($command.Source)) {
            $fallback = Join-Path $env:USERPROFILE ".local\bin\claude.exe"
            if (Test-Path -LiteralPath $fallback -PathType Leaf) {
              "path=$fallback" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              exit 0
            }
            throw "Claude Code executable was not found on the self-hosted runner PATH."
          }
          "path=$($command.Source)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Claude PR review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ steps.resolve-claude.outputs.path }}
          # classify_inline_comments left at DEFAULT "true": buffers unconfirmed
          # subagent/probe comments and filters them before posting after the session.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            The PR branch is checked out locally with full git history. Gather context:
            `gh pr view` (title/body) and `gh pr diff` (the canonical changed lines).
            Then INVESTIGATE FREELY: use Read / Grep / Glob and read-only git
            (git log / show / blame / diff / grep) to follow any suspicious change into
            the rest of the codebase before drawing a conclusion. Do not limit yourself
            to the diff - verify how changed code is actually used elsewhere.

            CRITICAL: We only want HIGH SIGNAL issues. Flag an issue ONLY when, after
            checking it against the real code, one of these clearly holds:
            - the code will fail to compile/parse (syntax/type error, missing import,
              unresolved reference), OR
            - the code will definitely produce wrong results regardless of input
              (clear logic error, broken edge case, wrong condition, off-by-one,
              transaction/resource misuse), OR
            - a real security, data-loss, or regression risk you can demonstrate, OR
            - a clear, unambiguous violation of a documented project rule (quote it).

            Do NOT flag, and do NOT comment about:
            - code style, formatting, naming, or subjective "improvements"/refactors
            - pre-existing issues not introduced by this PR
            - anything a linter or type-checker already catches
            - missing tests or general coverage/quality unless a documented rule requires it
            - issues that merely MIGHT occur depending on inputs/state you cannot verify
            - pedantic nitpicks a senior engineer would not raise

            Before posting, re-check each issue once against the actual code. If you are
            not certain it is real, DO NOT post it - false positives erode trust. Do not
            invent issues to fill space and do not write filler sections: zero findings is
            a perfectly good result.

            Output - ALWAYS post exactly ONE top-level `gh pr comment` (never stay silent,
            so there is always visible proof the review ran):
            - If there are NO high-signal issues, the top-level comment is EXACTLY
              "No blocking issues found." and nothing else.
            - If there ARE issues, OPEN the top-level comment with a one-line tally
              (e.g. "2 important, 3 nits") and do not restate the inline comments as
              sections. For each VERIFIED issue post ONE inline comment via
              mcp__github_inline_comment__create_inline_comment with confirmed: true,
              prefixed "important:" (fix before merge) or "nit:" (minor). One comment per
              unique issue, no duplicates. Add a ```suggestion block only when applying it
              fully fixes the issue. Post at most ~5 nits; if more, give the remaining
              count in the tally.

            Only post GitHub comments. Never emit the review as a chat message.
          claude_args: |
            --model claude-opus-4-8
            --effort xhigh
            --allowedTools "Read,Grep,Glob,LS,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git diff:*),Bash(git grep:*),Bash(rg:*),Bash(grep:*),Bash(find:*),Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*)"
            --disallowedTools "Edit,Write,MultiEdit,Bash(git push:*),Bash(git commit:*),Bash(git add:*),Bash(rm:*)"
