name: Claude Code Review

# Substantive automated review on every PR (official "Automatic PR Code Review"
# pattern: anthropics/claude-code-action docs/solutions.md). Not the plugin
# slash-command: no skip-gate, no "high-signal only" funnel; always posts a
# summary + suggestions + risks. Trigger: PR open only (no synchronize) to keep
# Max quota usage down. Model: Opus 4.8 + xhigh.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude PR review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Post inline comments immediately instead of buffering/classifying
          # them after the session ends.
          classify_inline_comments: "false"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform an automated review of this pull request. The PR branch is
            already checked out in the working directory.

            Gather context first:
            - `gh pr view` for the title, body, and metadata.
            - `gh pr diff` for the full diff.

            Then post EXACTLY ONE top-level comment with `gh pr comment`,
            containing these four sections in order:
              1. Summary - 2-5 sentences on what the PR changes.
              2. Code quality & best practices - observations on the diff.
              3. Suggestions & improvements - concrete, actionable, incl. minor.
              4. Risks, edge cases, security & performance - call out anything
                 to watch; if a section is empty, say so explicitly
                 (e.g. "No security concerns spotted.").

            Always produce a substantive review. NEVER reply only
            "No issues found" and never stay silent. If there are no blocking
            bugs, still deliver the summary and observations.

            For any line-level issue, ALSO post an inline comment via
            `mcp__github_inline_comment__create_inline_comment` with
            `confirmed: true`.

            Only post GitHub comments. Do not output the review as a chat message.
          claude_args: |
            --model claude-opus-4-8
            --effort xhigh
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
