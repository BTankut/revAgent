name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment: bulguları PR'a satır içi yorum olarak gönderir
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment"
          # Opus 4.8 + effort=xhigh (high<->max arası). --effort session-level CLI
          # flag'idir; plugin positional effort'u yok sayar, bu yüzden claude_args'ta.
          # Kotayı korumak için --effort high veya --model claude-sonnet-4-6'ya
          # düşürebilirsin. (ultra/ultracode kullanma: ultra bulut+kredili faturalanır,
          # ultracode bir effort seviyesi değildir.)
          claude_args: "--model claude-opus-4-8 --effort xhigh"
