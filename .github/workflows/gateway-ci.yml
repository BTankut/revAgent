name: Gateway CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - packages/gateway/**
      - .github/workflows/gateway-ci.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gateway-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gateway-ci:
    name: Gateway CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: revagent_eu10
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d revagent_eu10"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EU10_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/revagent_eu10

    steps:
      - name: Checkout the exact triggering head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify exact-head identity
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"
          git diff --cached --quiet HEAD --
          git diff --quiet --

      - name: Start local Keycloak OIDC evidence service
        shell: bash
        run: |
          set -euo pipefail
          admin_password="$(openssl rand -hex 32)"
          echo "::add-mask::$admin_password"
          echo "EU10_KEYCLOAK_ISSUER=http://127.0.0.1:58080/identity/realms/revagent" >> "$GITHUB_ENV"
          echo "EU10_KEYCLOAK_ADMIN_USERNAME=eu10admin" >> "$GITHUB_ENV"
          echo "EU10_KEYCLOAK_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          credential_file="$RUNNER_TEMP/eu10-keycloak-bootstrap"
          keycloak_data="$RUNNER_TEMP/eu10-keycloak-data"
          printf '%s' "$admin_password" > "$credential_file"
          mkdir -p "$keycloak_data"
          chmod 0400 "$credential_file"
          chmod 0700 "$keycloak_data"
          sudo chown 1000:1000 "$credential_file" "$keycloak_data"
          export KEYCLOAK_BOOTSTRAP_CREDENTIAL_FILE="$credential_file"
          export KEYCLOAK_DATA_HOST_PATH="$keycloak_data"
          export KEYCLOAK_ADMIN_USERNAME=eu10admin
          docker compose \
            --project-name revagent-eu10-ci \
            --env-file deploy/phase1/.env.example \
            --file deploy/phase1/docker-compose.yml \
            --file deploy/phase1/keycloak/docker-compose.test.yml \
            up --detach keycloak
          for attempt in $(seq 1 60); do
            if curl --fail --silent \
              http://127.0.0.1:58080/identity/realms/revagent/.well-known/openid-configuration \
              > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose \
            --project-name revagent-eu10-ci \
            --env-file deploy/phase1/.env.example \
            --file deploy/phase1/docker-compose.yml \
            --file deploy/phase1/keycloak/docker-compose.test.yml \
            logs keycloak
          exit 1

      - name: Scan tracked history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Build the Gateway image from exact tracked bytes
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar HEAD |
            docker build \
              --file packages/gateway/Dockerfile \
              --tag "revagent-gateway:ci-${EXPECTED_HEAD_SHA::12}" \
              -

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install migration workspace dependencies
        run: npm ci --ignore-scripts

      - name: Build and verify the allowlisted native dependency
        run: |
          npm rebuild better-sqlite3 --ignore-scripts=false --foreground-scripts
          npm run verify:native-dependencies

      - name: Lint Gateway
        run: npm run lint --workspace @revagent/gateway

      - name: Type-check Gateway
        run: npm run typecheck --workspace @revagent/gateway

      - name: Test Gateway
        run: npm test --workspace @revagent/gateway

      - name: Emit GW-13 readiness evidence
        if: always()
        run: >-
          npm run readiness:gw13 --workspace @revagent/gateway --
          --source-revision "${{ env.EXPECTED_HEAD_SHA }}"
          --output packages/gateway/artifacts/gw13-readiness.json

      - name: Upload GW-13 readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gw13-readiness-${{ env.EXPECTED_HEAD_SHA }}
          path: packages/gateway/artifacts/gw13-readiness.json
          if-no-files-found: error
