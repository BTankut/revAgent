name: Signed Source-Free CD

on:
  workflow_dispatch:
    inputs:
      runner_labels_json:
        description: 'JSON array of runner labels. Use the office self-hosted runner for signing and NAS access.'
        required: true
        default: '["self-hosted","Windows","revagent-cd"]'
      version:
        description: 'Optional release version. Empty uses the publisher default.'
        required: false
        default: ''
      release_sequence:
        description: 'Optional positive releaseSequence. Empty uses the publisher timestamp default.'
        required: false
        default: ''
      minimum_accepted_release_sequence:
        description: 'Optional minimumAcceptedReleaseSequence.'
        required: false
        default: ''
      publish_to_nas:
        description: 'Publish the validated signed artifact to the NAS stable channel after environment approval.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: signed-source-free-cd
  cancel-in-progress: false

jobs:
  build-signed-release:
    name: Build signed source-free release
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    environment: revagent-release-signing

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Build and validate signed release root
        shell: pwsh
        env:
          REVAGENT_RELEASE_SIGNING_PRIVATE_KEY_PATH: ${{ vars.REVAGENT_RELEASE_SIGNING_PRIVATE_KEY_PATH }}
          REVAGENT_RELEASE_SIGNING_KEY_ID: ${{ vars.REVAGENT_RELEASE_SIGNING_KEY_ID }}
          REVAGENT_TRUSTED_RELEASE_KEYS_PATH: ${{ vars.REVAGENT_TRUSTED_RELEASE_KEYS_PATH }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("REVAGENT_RELEASE_SIGNING_PRIVATE_KEY_PATH", "REVAGENT_RELEASE_SIGNING_KEY_ID", "REVAGENT_TRUSTED_RELEASE_KEYS_PATH")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required protected environment variable is missing: $name"
            }
          }

          $releaseRoot = Join-Path $env:RUNNER_TEMP "revagent-signed-release-root"
          if (Test-Path -LiteralPath $releaseRoot) {
            Remove-Item -LiteralPath $releaseRoot -Recurse -Force
          }

          $releaseSequence = if ([string]::IsNullOrWhiteSpace("${{ inputs.release_sequence }}")) { [long]0 } else { [long]"${{ inputs.release_sequence }}" }
          $minimumAcceptedReleaseSequence = if ([string]::IsNullOrWhiteSpace("${{ inputs.minimum_accepted_release_sequence }}")) { [long]0 } else { [long]"${{ inputs.minimum_accepted_release_sequence }}" }

          $args = @{
            ReleaseRoot = $releaseRoot
            SigningPrivateKeyPath = $env:REVAGENT_RELEASE_SIGNING_PRIVATE_KEY_PATH
            SigningKeyId = $env:REVAGENT_RELEASE_SIGNING_KEY_ID
            TrustedKeysPath = $env:REVAGENT_TRUSTED_RELEASE_KEYS_PATH
            ReleaseSequence = $releaseSequence
            MinimumAcceptedReleaseSequence = $minimumAcceptedReleaseSequence
            Force = $true
          }
          if (-not [string]::IsNullOrWhiteSpace("${{ inputs.version }}")) {
            $args["Version"] = "${{ inputs.version }}"
          }

          .\scripts\invoke-signed-source-free-cd.ps1 @args

      - name: Upload signed release root
        uses: actions/upload-artifact@v4
        with:
          name: revagent-signed-release-root
          path: ${{ runner.temp }}\revagent-signed-release-root
          if-no-files-found: error
          retention-days: 14

  publish-to-nas:
    name: Publish signed release to NAS
    needs: build-signed-release
    if: ${{ inputs.publish_to_nas }}
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    environment: revagent-production-publish

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Download signed release root
        uses: actions/download-artifact@v4
        with:
          name: revagent-signed-release-root
          path: ${{ runner.temp }}\downloaded-release-root

      - name: Publish to NAS stable
        shell: pwsh
        env:
          REVAGENT_NAS_RELEASE_ROOT: ${{ vars.REVAGENT_NAS_RELEASE_ROOT }}
          REVAGENT_TRUSTED_RELEASE_KEYS_PATH: ${{ vars.REVAGENT_TRUSTED_RELEASE_KEYS_PATH }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("REVAGENT_NAS_RELEASE_ROOT", "REVAGENT_TRUSTED_RELEASE_KEYS_PATH")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required protected environment variable is missing: $name"
            }
          }

          $sourceReleaseRoot = Join-Path $env:RUNNER_TEMP "downloaded-release-root"
          if (-not (Test-Path -LiteralPath (Join-Path $sourceReleaseRoot "channels\stable.json") -PathType Leaf)) {
            $nestedRoot = Get-ChildItem -LiteralPath $sourceReleaseRoot -Directory |
              Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName "channels\stable.json") -PathType Leaf } |
              Select-Object -First 1
            if ($nestedRoot) {
              $sourceReleaseRoot = $nestedRoot.FullName
            }
          }

          .\scripts\publish-signed-source-free-release-to-nas.ps1 `
            -SourceReleaseRoot $sourceReleaseRoot `
            -NasReleaseRoot $env:REVAGENT_NAS_RELEASE_ROOT `
            -TrustedKeysPath $env:REVAGENT_TRUSTED_RELEASE_KEYS_PATH `
            -Force
