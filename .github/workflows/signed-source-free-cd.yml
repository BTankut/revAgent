name: Signed Source-Free CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner_labels_json:
        description: 'JSON array of runner labels. Use the office self-hosted runner for signing and NAS access.'
        required: true
        default: '["self-hosted","Windows","revagent-cd"]'
      version:
        description: 'Optional release version. Empty uses the publisher default.'
        required: false
        default: ''
      release_sequence:
        description: 'Optional positive releaseSequence. Empty uses the publisher timestamp default.'
        required: false
        default: ''
      minimum_accepted_release_sequence:
        description: 'Optional minimumAcceptedReleaseSequence.'
        required: false
        default: ''
      publish_to_nas:
        description: 'Publish the validated signed artifact to the NAS stable channel. Production publish requires manual workflow dispatch.'
        required: true
        type: boolean
        default: false
      allow_rollback:
        description: 'Allow signed rollback, same-sequence repair, or one-time legacy stable bootstrap during NAS publish.'
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  checks: read
  contents: read

concurrency:
  group: signed-source-free-cd
  cancel-in-progress: false

jobs:
  build-signed-release:
    name: Build signed source-free release
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.runner_labels_json || '["self-hosted","Windows","revagent-cd"]') }}
    environment: revagent-release-signing
    outputs:
      release_root: ${{ steps.build.outputs.release_root }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate main commit gates before production publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_nas }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REVAGENT_REQUIRED_CHECKS: Engineering gates
          REVAGENT_COMMIT_GATE_TIMEOUT_SECONDS: "1200"
        run: |
          $ErrorActionPreference = "Stop"

          $requiredChecks = @(
            $env:REVAGENT_REQUIRED_CHECKS -split "," |
              ForEach-Object { $_.Trim() } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          if ($requiredChecks.Count -eq 0) {
            throw "No required commit checks were configured for production publish."
          }

          $timeoutSeconds = [int]$env:REVAGENT_COMMIT_GATE_TIMEOUT_SECONDS
          if ($timeoutSeconds -lt 1) {
            $timeoutSeconds = 1200
          }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/check-runs?per_page=100"
          $deadline = [DateTime]::UtcNow.AddSeconds($timeoutSeconds)

          while ($true) {
            $response = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
            $checkRuns = @($response.check_runs)
            $missing = [System.Collections.Generic.List[string]]::new()
            $pending = [System.Collections.Generic.List[string]]::new()
            $failed = [System.Collections.Generic.List[string]]::new()

            foreach ($requiredCheck in $requiredChecks) {
              $latest = @(
                $checkRuns |
                  Where-Object { $_.name -eq $requiredCheck } |
                  Sort-Object `
                    @{ Expression = { if ($_.started_at) { [DateTime]$_.started_at } else { [DateTime]::MinValue } }; Descending = $true },
                    @{ Expression = { if ($_.completed_at) { [DateTime]$_.completed_at } else { [DateTime]::MinValue } }; Descending = $true }
              ) | Select-Object -First 1

              if (-not $latest) {
                $missing.Add($requiredCheck) | Out-Null
                continue
              }

              if ($latest.status -ne "completed") {
                $pending.Add("$requiredCheck status=$($latest.status)") | Out-Null
                continue
              }

              if ($latest.conclusion -ne "success") {
                $failed.Add("$requiredCheck conclusion=$($latest.conclusion) url=$($latest.html_url)") | Out-Null
              }
            }

            if ($failed.Count -gt 0) {
              throw "Production publish blocked by failed commit check(s): $($failed -join '; ')"
            }

            if ($missing.Count -eq 0 -and $pending.Count -eq 0) {
              Write-Host "Production publish commit gates passed: $($requiredChecks -join ', ')"
              break
            }

            if ([DateTime]::UtcNow -ge $deadline) {
              $parts = @()
              if ($missing.Count -gt 0) { $parts += "missing: $($missing -join ', ')" }
              if ($pending.Count -gt 0) { $parts += "pending: $($pending -join ', ')" }
              throw "Production publish blocked while waiting for commit check(s): $($parts -join '; ')"
            }

            Write-Host "Waiting for production publish commit gates. Missing: $($missing -join ', '); pending: $($pending -join ', ')"
            Start-Sleep -Seconds 15
          }

      - name: Build and validate signed release root
        id: build
        shell: pwsh
        env:
          REVAGENT_RELEASE_SIGNING_PRIVATE_KEY_PATH: ${{ vars.REVAGENT_RELEASE_SIGNING_PRIVATE_KEY_PATH }}
          REVAGENT_RELEASE_SIGNING_KEY_ID: ${{ vars.REVAGENT_RELEASE_SIGNING_KEY_ID }}
          REVAGENT_TRUSTED_RELEASE_KEYS_PATH: ${{ vars.REVAGENT_TRUSTED_RELEASE_KEYS_PATH }}
          REVAGENT_CD_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          REVAGENT_CD_RELEASE_SEQUENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sequence || '' }}
          REVAGENT_CD_MINIMUM_ACCEPTED_RELEASE_SEQUENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.minimum_accepted_release_sequence || '' }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("REVAGENT_RELEASE_SIGNING_PRIVATE_KEY_PATH", "REVAGENT_RELEASE_SIGNING_KEY_ID", "REVAGENT_TRUSTED_RELEASE_KEYS_PATH")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required protected environment variable is missing: $name"
            }
          }

          $stagingRoot = Join-Path $env:RUNNER_WORKSPACE "_revagent_signed_cd"
          New-Item -ItemType Directory -Force -Path $stagingRoot | Out-Null
          Get-ChildItem -LiteralPath $stagingRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.LastWriteTimeUtc -lt [DateTime]::UtcNow.AddDays(-14) } |
            Remove-Item -Recurse -Force

          $runKey = "{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          $releaseRoot = Join-Path $stagingRoot $runKey
          if (Test-Path -LiteralPath $releaseRoot) {
            Remove-Item -LiteralPath $releaseRoot -Recurse -Force
          }

          $releaseSequence = if ([string]::IsNullOrWhiteSpace($env:REVAGENT_CD_RELEASE_SEQUENCE)) { [long]0 } else { [long]$env:REVAGENT_CD_RELEASE_SEQUENCE }
          $minimumAcceptedReleaseSequence = if ([string]::IsNullOrWhiteSpace($env:REVAGENT_CD_MINIMUM_ACCEPTED_RELEASE_SEQUENCE)) { [long]0 } else { [long]$env:REVAGENT_CD_MINIMUM_ACCEPTED_RELEASE_SEQUENCE }

          $args = @{
            ReleaseRoot = $releaseRoot
            SigningPrivateKeyPath = $env:REVAGENT_RELEASE_SIGNING_PRIVATE_KEY_PATH
            SigningKeyId = $env:REVAGENT_RELEASE_SIGNING_KEY_ID
            TrustedKeysPath = $env:REVAGENT_TRUSTED_RELEASE_KEYS_PATH
            ReleaseSequence = $releaseSequence
            MinimumAcceptedReleaseSequence = $minimumAcceptedReleaseSequence
            Force = $true
          }
          if (-not [string]::IsNullOrWhiteSpace($env:REVAGENT_CD_VERSION)) {
            $args["Version"] = $env:REVAGENT_CD_VERSION
          }

          .\scripts\invoke-signed-source-free-cd.ps1 @args

          "release_root=$releaseRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Remove staged release root after no-publish validation
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.publish_to_nas)) && success() }}
        shell: pwsh
        run: |
          $releaseRoot = "${{ steps.build.outputs.release_root }}"
          if (-not [string]::IsNullOrWhiteSpace($releaseRoot) -and (Test-Path -LiteralPath $releaseRoot)) {
            Remove-Item -LiteralPath $releaseRoot -Recurse -Force
          }

  publish-to-nas:
    name: Publish signed release to NAS
    needs: build-signed-release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_nas }}
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    environment: revagent-production-publish

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve staged signed release root
        shell: pwsh
        run: |
          $sourceReleaseRoot = "${{ needs.build-signed-release.outputs.release_root }}"
          if ([string]::IsNullOrWhiteSpace($sourceReleaseRoot)) {
            throw "Build job did not expose a staged signed release root path."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $sourceReleaseRoot "channels\stable.json") -PathType Leaf)) {
            throw "Staged signed release root is missing channels\stable.json: $sourceReleaseRoot"
          }

          "REVAGENT_SIGNED_RELEASE_ROOT=$sourceReleaseRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish to NAS stable
        shell: pwsh
        env:
          REVAGENT_NAS_RELEASE_ROOT: ${{ vars.REVAGENT_NAS_RELEASE_ROOT }}
          REVAGENT_TRUSTED_RELEASE_KEYS_PATH: ${{ vars.REVAGENT_TRUSTED_RELEASE_KEYS_PATH }}
          REVAGENT_CD_ALLOW_ROLLBACK: ${{ inputs.allow_rollback }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("REVAGENT_NAS_RELEASE_ROOT", "REVAGENT_TRUSTED_RELEASE_KEYS_PATH")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required protected environment variable is missing: $name"
            }
          }

          $sourceReleaseRoot = $env:REVAGENT_SIGNED_RELEASE_ROOT

          $nasReleaseRoot = $env:REVAGENT_NAS_RELEASE_ROOT.Trim()
          if ([string]::IsNullOrWhiteSpace($nasReleaseRoot)) {
            throw "No NAS release root was configured for production publish."
          }

          Write-Host "Publishing signed release to NAS root: $nasReleaseRoot"
          $publishArgs = @{
            SourceReleaseRoot = $sourceReleaseRoot
            NasReleaseRoot = $nasReleaseRoot
            TrustedKeysPath = $env:REVAGENT_TRUSTED_RELEASE_KEYS_PATH
            Force = $true
          }
          if ([string]::Equals($env:REVAGENT_CD_ALLOW_ROLLBACK, "true", [System.StringComparison]::OrdinalIgnoreCase)) {
            $publishArgs["AllowRollback"] = $true
          }

          .\scripts\publish-signed-source-free-release-to-nas.ps1 @publishArgs

      - name: Remove staged release root after NAS publish
        if: ${{ success() }}
        shell: pwsh
        run: |
          $releaseRoot = "${{ needs.build-signed-release.outputs.release_root }}"
          if (-not [string]::IsNullOrWhiteSpace($releaseRoot) -and (Test-Path -LiteralPath $releaseRoot)) {
            Remove-Item -LiteralPath $releaseRoot -Recurse -Force
          }
